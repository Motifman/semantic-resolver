[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-resolver"
version = "0.1.0"
description = "固定スキーマのまま、入力を動的な説明付き候補へ意味で解決する"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/Motifman/semantic-resolver"
Issues = "https://github.com/Motifman/semantic-resolver/issues"

[project.optional-dependencies]
jev = ["httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff", "mypy"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
